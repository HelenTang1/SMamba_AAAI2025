defaults:
  - base

name: dsec

# DSEC root. This should be the directory that contains train/ and test/.
path: /data4/yhtang/dataset/DSEC_det/data/

# Keep the representation setting consistent with Gen1/Gen4.
# The DSEC adapter builds this representation on-the-fly from raw events.
ev_repr_name: 'stacked_histogram_dt=50_nbins=10'
bins: 10
count_cutoff: 10
fastmode: True

# DSEC original event camera resolution.
input_hw: [480, 640]
resolution_hw: [480, 640]

# Dataset-level default, like Gen1's dataset yaml.
# The experiment config can override this to 21.
sequence_length: 11

# Make DSEC spatial size close to Gen1: 480x640 -> 240x320.
# The adapter downscales event representations with nearest-exact and scales boxes by 0.5.
downsample_by_factor_2: True
only_load_end_labels: False

