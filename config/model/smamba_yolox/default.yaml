# @package _global_
defaults:
  - override /model: rnndet

model:
  backbone:
    name: SMambaRNN
    compile:
      enable: False
      args:
        mode: reduce-overhead
    input_channels: 20
    enable_masking: False
    partition_split_32: 2
    embed_dim: 64
    dim_multiplier: [1, 2, 4, 8]
    num_blocks: [1, 1, 1, 1]
    T_max_chrono_init: [4, 8, 16, 32]
    gaussian_kernel: 5
    factor: 1.2
    resolution_hw: [384, 640]
    stem:
      patch_size: 4
    stage:
      downsample:
        type: patch
        overlap: True
        norm_affine: True
      attention:
        use_torch_mha: False
        partition_size: ???
        dim_head: 32
        attention_bias: True
        mlp_activation: gelu
        mlp_gated: False
        mlp_bias: True
        mlp_ratio: 4
        drop_mlp: 0
        drop_path: 0
        ls_init_value: 1e-5
      lstm:
        dws_conv: False
        dws_conv_only_hidden: True
        dws_conv_kernel_size: 3
        drop_cell_update: 0

    eventddt_encoding:
      enable: false
      repo_root: /data4/yhtang/exp/EventDDT_Private
      tokenizer_config_path: configs/tokenizer_config.yaml
      experiment_config_path: configs/tokenizer_experiment/exp2_Event_Scratch_rev.yaml
      dataset_config_path: configs/dataset/DSEC.yaml
      ckpt_path: "/data4/yhtang/exp/EventDDT_Private/outputs_tok_v2.1/tok_dsec_exp/exp2_Event_scratch_rev_lb0p125_LRresume2/checkpoints/best_val_large_alpha-step=067000-val_large_alpha=0.3525.ckpt"

      freeze: true
      strict_load: false
      disable_decoder_pretrained: true

      tokenizer_t: 0.5
      output_dtype: input
      eventddt_cfg_override: null

    eventddt_priority:
      enable: false
      token_dim: 512
      hidden_dim: 128
      detach_tokens: true
      rank_decay: 3.0 # larger value means more belief in the first few tokens 
      temperature: 0.07 # similarity sharpness
      first_k_tokens: null # if not null, only use first k tokens
  fpn:
    name: PAFPN
    compile:
      enable: False
      args:
        mode: reduce-overhead
    depth: 0.67 # round(depth * 3) == num bottleneck blocks
    # stage 1 is the first and len(num_layers) is the last
    in_stages: [2, 3, 4]
    depthwise: False
    act: "silu"
  head:
    name: YoloX
    compile:
      enable: False
      args:
        mode: reduce-overhead
    depthwise: False
    act: "silu"
  postprocess:
    confidence_threshold: 0.1
    nms_threshold: 0.45
